name: Deploy Prerender To Vercel

on:
  push:
    branches:
      - main
      - prerender
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: prerender-deploy-${{ github.ref }}
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate required secrets
        shell: bash
        run: |
          missing=()

          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            missing+=("VERCEL_TOKEN")
          fi
          if [ -z "${{ secrets.VERCEL_ORG_ID }}" ]; then
            missing+=("VERCEL_ORG_ID")
          fi
          if [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            missing+=("VERCEL_PROJECT_ID")
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required GitHub repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build with prerender
        run: npm run build:prerender

      - name: Verify prerender output
        run: npm run verify:prerender

      - name: Decide Deployment Target
        id: deploy_target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target="${{ github.event.inputs.target }}"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            target="production"
          else
            target="preview"
          fi

          echo "target=${target}" >> "$GITHUB_OUTPUT"
          echo "Deploy target is ${target}"

      - name: Add routing config to dist
        run: cp vercel.static.json dist/vercel.json

      - name: Pull Vercel project settings
        shell: bash
        run: |
          if [ "${{ steps.deploy_target.outputs.target }}" = "production" ]; then
            environment="production"
          else
            environment="preview"
          fi

          npx vercel pull --yes --environment="${environment}" --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prerendered dist
        id: deploy
        shell: bash
        run: |
          if [ "${{ steps.deploy_target.outputs.target }}" = "production" ]; then
            deploy_output=$(npx vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}" dist)
          else
            deploy_output=$(npx vercel deploy --yes --token="${{ secrets.VERCEL_TOKEN }}" dist)
          fi

          echo "${deploy_output}"
          url=$(printf '%s\n' "${deploy_output}" | grep -Eo 'https://[^ ]+' | tail -n 1 || true)

          if [ -z "${url}" ]; then
            echo "Failed to determine deployment URL from Vercel output"
            exit 1
          fi

          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: ${url}"

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "## Prerender Deployment"
            echo
            echo "- Target: ${{ steps.deploy_target.outputs.target }}"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
