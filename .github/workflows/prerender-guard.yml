name: Prerender Guard

on:
  pull_request:
  push:
    branches:
      - main
      - prerender

jobs:
  verify-prerender:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with prerender
        run: npm run build:prerender

      - name: Verify prerender output
        run: npm run verify:prerender
